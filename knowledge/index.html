<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge - Login</title>

    <!-- Icono de la pestaña del navegador (Favicon) -->
    <link rel="shortcut icon" href="img/logo.png" type="image/x-icon">
    
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/login_style.css">
</head>
<body>

    <!-- Contenedor principal centrado -->
    <main class="login-wrapper">
        
        <!-- Tarjeta del formulario -->
        <div class="login-card">
            
            <!-- Encabezado con Logo del gato centrado arriba -->
            <header class="login-header">
                <img src="img/logo.png" alt="Logo Gatito" class="logo-gatito">
                <h1>Knowledge</h1>
            </header>

            <form id="form-login" class="login-form">
                
                <!-- Campo: Correo -->
                <div class="input-group">
                    <label for="correo">CORREO</label>
                    <input type="email" id="correo" name="correo" placeholder="Correo@gmail.com" required>
                </div>

                <!-- Campo: Contraseña -->
                <div class="input-group">
                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-ingresar">Ingresar</button>

            </form>

            <footer class="login-footer">
                <a href="auth/registro.html" class="btn-registrar">REGISTRAR CUENTA</a>
            </footer>

        </div>

        <!-- Alerta flotante AL LADO de la tarjeta -->
        <aside id="alerta-gato" class="alerta-gato-lateral oculto">
            <div class="gato-burbuja">
                <img id="gato-img" src="img/gato_x1.jpg" alt="Gato Alerta" class="gato-alerta-grande">
                <div class="mensaje-globo">
                    <p id="gato-mensaje">¡Oye! Tu correo o contraseña son incorrectos 🙀</p>
                </div>
            </div>
        </aside>

    </main>

    <script src="js/login_script.js"></script>
</body>
</html>
