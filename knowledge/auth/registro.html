<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge - Registro</title>

    <link rel="shortcut icon" href="../img/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/login_style.css">
</head>
<body>

    <main class="login-wrapper">
        
        <div class="login-card login-card-wide">
            
            <header class="login-header">
                <img src="../img/logo.png" alt="Logo Gatito" class="logo-gatito logo-gatito-sm">
                <h1 class="titulo-sm">Crear Cuenta</h1>
            </header>

            <form id="form-registro" class="login-form">
                
                <div class="input-group">
                    <label>TIPO DE USUARIO</label>
                    <div class="rol-selector">
                        <label class="rol-option active">
                            <input type="radio" name="rol" value="alumno" checked>
                            <span>Alumno</span>
                        </label>
                        <label class="rol-option">
                            <input type="radio" name="rol" value="docente">
                            <span>Docente</span>
                        </label>
                        <label class="rol-option">
                            <input type="radio" name="rol" value="padre">
                            <span>Padre</span>
                        </label>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="nombre">NOMBRE COMPLETO</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                    </div>

                    <div class="input-group">
                        <label for="correo">CORREO</label>
                        <input type="email" id="correo" name="correo" placeholder="correo@gmail.com" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="password">CONTRASEÑA</label>
                        <div class="password-box">
                            <input type="password" id="password" name="password" placeholder="••••••••" required>
                            <span class="toggle-eye" onclick="verPassword('password', this)">👁️</span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="confirm_password">CONFIRMAR CONTRASEÑA</label>
                        <div class="password-box">
                            <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
                            <span class="toggle-eye" onclick="verPassword('confirm_password', this)">👁️</span>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-ingresar">Registrarse</button>

            </form>

            <footer class="login-footer">
                <a href="../index.html" class="btn-registrar">¿YA TIENES CUENTA? INICIA SESIÓN</a>
            </footer>

        </div>

        <aside id="alerta-gato" class="alerta-gato-lateral oculto">
            <div class="gato-burbuja">
                <img id="gato-img" src="../img/gato_x2.jpg" alt="Gato Alerta" class="gato-alerta-grande">
                <div id="globo-contenedor" class="mensaje-globo">
                    <p id="gato-mensaje">¡Operación realizada!</p>
                </div>
            </div>
        </aside>

    </main>

    <script src="../js/registro_script.js"></script>
</body>
</html>
